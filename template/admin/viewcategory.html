{% extends "admin/view.html" %}
{% block view %}

<!-- Main Section -->
    <main class="main-section">

        <h1>View Category Data</h1>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Category ID</th>
                        <th>Category name</th>
                        <th>Description</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    {% if category %}
                    {% for c in category %}

                    <tr>
                        <td>{{ c.cid }}</td>
                        <td>{{ c.cname }}</td>
                        <td>{{ c.cdescription }}</td>
                       

                        <td>
                            
                            <a href="{% url 'admin_editCategory' c.cid %}"
                               class="edit-btn">
                                Edit
                            </a>

                            <a href="{% url 'admin_deleteCategory' c.cid %}"
                               class="delete-btn"
                               onclick="return confirm('Are you sure you want to delete this Category ?');">
                                Delete
                            </a>
                        </td>
                    </tr>

                    {% endfor %}
                    {% endif %}

                </tbody>

            </table>

        </div>

    </main>
<a href="/admin_dashboard" class="btn btn-lg btn-primary">Back</a>

{% endblock  %}
