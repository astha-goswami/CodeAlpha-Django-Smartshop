{% extends "base.html" %}
{% load static %}

{{% block base %}

<div class="register-container">

    <h1>Create Account</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form }}

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

</div>

{% endblock  %}}
